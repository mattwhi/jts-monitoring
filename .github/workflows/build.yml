name: Build JTS Monitor

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push JTS Monitor
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    name: Deploy to JTS Docker VM
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/jts-monitor-deploy
          chmod 600 ~/.ssh/jts-monitor-deploy
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy JTS Monitor
        run: |
          ssh \
            -i ~/.ssh/jts-monitor-deploy \
            -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" << 'EOF'

          set -e

          echo "=== JTS Monitor deployment ==="

          cd /opt/jts-monitor

          echo "Pulling latest image..."
          docker compose pull

          echo "Deploying containers..."
          docker compose up -d

          echo "Waiting for dashboard..."
          sleep 10

          echo "Checking containers..."
          docker compose ps

          echo "Checking JTS Monitor health..."
          curl --fail --silent --show-error \
            http://localhost:3011/api/health

          echo
          echo "=== JTS Monitor deployment successful ==="
          EOF